# Dheera Creatives — approved same-origin production deployment.
#
# NOT installed or enabled by this repository. Copy it to the server after the
# operator has verified the domain, TLS certificate paths and upstream port.
#
#   sudo cp deploy/nginx/dheera.digimaraa.in.conf /etc/nginx/sites-available/
#   sudo cp deploy/nginx/dheera-proxy.conf /etc/nginx/snippets/
#   sudo ln -s /etc/nginx/sites-available/dheera.digimaraa.in.conf \
#              /etc/nginx/sites-enabled/dheera.digimaraa.in.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Everything (public site, /admin, /api and /uploads) is served by one NestJS
# process. Keeping one origin keeps the admin cookies first-party.

upstream dheera_creatives {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dheera.digimaraa.in;

    # Keep ACME HTTP-01 challenges on HTTP for certificate renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # nginx >= 1.25.1: replace the two lines above with
    #   listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name dheera.digimaraa.in;
    server_tokens off;

    ssl_certificate         /etc/letsencrypt/live/dheera.digimaraa.in/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/dheera.digimaraa.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dheera.digimaraa.in/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;  # used for OCSP stapling only
    resolver_timeout 5s;

    # 5 MB upload limit plus multipart overhead. The app enforces 5 MB itself.
    client_max_body_size 6m;
    client_body_timeout 30s;

    # HSTS, CSP, X-Frame-Options, nosniff and Referrer-Policy are sent by
    # NestJS in production. Do not duplicate them here.

    # Normalise the dashboard root so relative Vite assets resolve under /admin/.
    location = /admin {
        return 301 /admin/;
    }

    # API routes. Authentication, CSRF and rate limiting stay in NestJS.
    location /api/ {
        include /etc/nginx/snippets/dheera-proxy.conf;
        proxy_pass http://dheera_creatives;
    }

    # Uploaded images. Proxied to NestJS so its immutable cache, nosniff and
    # restrictive CSP headers stay authoritative. Do not enable directory
    # listing or serve this path from an unmanaged alias.
    location /uploads/ {
        include /etc/nginx/snippets/dheera-proxy.conf;
        proxy_pass http://dheera_creatives;
        proxy_read_timeout 30s;
    }

    # Admin SPA and its hashed assets.
    location /admin/ {
        include /etc/nginx/snippets/dheera-proxy.conf;
        proxy_pass http://dheera_creatives;
    }

    # Public website and everything else.
    location / {
        include /etc/nginx/snippets/dheera-proxy.conf;
        proxy_pass http://dheera_creatives;
    }
}
